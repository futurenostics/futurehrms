services:
  postgres:
    image: postgres:16-alpine
    container_name: fn-hrms-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms_dev_password
      POSTGRES_DB: hrms_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrms -d hrms_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fn-hrms-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: fn-hrms-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_dev_password
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot container that creates required buckets on startup, then exits.
  minio-bootstrap:
    image: minio/mc:latest
    container_name: fn-hrms-minio-bootstrap
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minio_admin minio_dev_password; do echo 'waiting for minio...'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/fn-hrms-documents;
      /usr/bin/mc mb --ignore-existing local/fn-hrms-template-assets;
      /usr/bin/mc anonymous set none local/fn-hrms-documents;
      /usr/bin/mc anonymous set none local/fn-hrms-template-assets;
      echo 'MinIO buckets ready.';
      "
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    container_name: fn-hrms-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:
